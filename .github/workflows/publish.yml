name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（形如 1.2.3）；留空则用 package.json 当前版本
        required: false
      dry-run:
        description: 只打包校验，不发布到 registry
        type: boolean
        default: false

# 发布是带外部副作用的动作，绝不能像 CI 那样 cancel-in-progress：
# publish 传到一半被取消，registry 上这个版本号已经被占住，
# 重跑只会得到 403（npm 不允许覆盖已发布的版本，只能发新版本号）。
# 所以这里排队，而不是取消。
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # provenance 签名需要 OIDC 令牌换取签名证书
  id-token: write

env:
  EVENT_NAME: ${{ github.event_name }}
  TAG_NAME: ${{ github.ref_name }}
  INPUT_VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry-run }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # registry-url 会写入 .npmrc，npm publish 才会读取 NODE_AUTH_TOKEN
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # 门禁。发布不可逆，值得再跑一次：从非 main 分支打的 tag，
      # CI 从未在上面跑过，这里是唯一一道防线。
      - name: Check
        run: pnpm check

      # 版本号以 tag 为唯一事实来源。否则很容易出现 tag 打的是 v1.2.3、
      # package.json 还是 1.0.0，于是发出去一个谁都没预料的版本。
      #
      # 必须排在 Build CLI 之前：src/cli/version.ts 是
      # `import pkg from "../../package.json"`，esbuild 会把 version 字段
      # 内联进 bundle。先 build 后定版本时，发出去的 CLI 报的是仓库里的旧号
      # 而不是 tag 上的号——此前只靠 npm pack 隐式重跑 prepare 才碰巧修好，
      # 加一个 --ignore-scripts 就会翻车。
      - name: 确定版本号
        id: version
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${TAG_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          # 必须是完整 semver：v1.2、release-1.2.3 这类 tag 不该被静默
          # 转成 npm 能接受但语义不明的东西，直接拦下让人去改 tag。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不是合法 semver：'$VERSION'（tag 应为 v1.2.3，预发布用 v1.2.3-beta.1）"
            exit 1
          fi
          # 用 pkg set 而不是 npm version：后者会碰 git（要求工作区干净），
          # 在 CI 里没这个必要。
          npm pkg set version="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION"

      # bin/mini-pi-cli.cjs 在 .gitignore 里（构建产物不入库），
      # 仓库中并不存在，全靠这一步产出。不把它寄托在 pnpm install 的
      # prepare 是否触发上——包里少了可执行文件，用户装完就是
      # command not found，而 pipeline 全程绿灯。
      #
      # 显式 build 同时也保证了"定版本"真的进了 bundle：下面的打包校验会跑
      # 一次 `--version`，与 $VERSION 逐字比对。
      - name: Build CLI
        run: pnpm build:cli

      - name: 预检
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$PKG@$VERSION 已存在，正式发布会被拒绝"
            else
              echo "::error::$PKG@$VERSION 已存在于 registry，不能重复发布，请改用新版本号"
              exit 1
            fi
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::未配置 NPM_TOKEN secret：Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: 打包并校验产物
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # tarball 名不等于包名：scoped 包会去掉 @、把 / 换成 -
          # （@minipi/mini-pi → minipi-mini-pi-<version>.tgz）。直接拿包名拼
          # 路径会拼出一个带斜杠的地址，tar 必然找不到文件。
          ARCHIVE="$(node -p "require('./package.json').name.replace(/^@/,'').replace('/','-')")"
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/$ARCHIVE-$VERSION.tgz"
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/smoke"
          PKG_DIR="$RUNNER_TEMP/smoke/package"
          CLI="$PKG_DIR/bin/mini-pi-cli.cjs"

          # 最关键的一条：bin 产物被 .gitignore 忽略，靠 package.json 的
          # files 白名单才进得了包。files 哪天被误删，这里立刻红。
          test -f "$CLI"
          node --check "$CLI"
          head -1 "$CLI" | grep -q '^#!/usr/bin/env node'

          # 真跑一次产物：--version 在任何初始化之前打印并返回，不会起 REPL
          # 占住 stdin（此前只能做语法检查，包能不能跑全靠推断）。
          # 同时校验版本号确实是"定版本"那一步写进去的那一个。
          OUT="$(node "$CLI" --version)"
          echo "版本输出：$OUT"
          test "$OUT" = "mini-pi v$VERSION"

          # bundle 里的内联版本与包元数据必须一致：升级检测是拿 registry 上的
          # 版本与 APP_VERSION 比较，两者漂移会让用户永远看到"有新版本"。
          META_VERSION="$(node -p "require('$PKG_DIR/package.json').version")"
          test "$META_VERSION" = "$VERSION"

          echo "包内容：$(tar -tzf "$TARBALL" | wc -l) 个文件，$(du -h "$TARBALL" | cut -f1)"
          tar -tzf "$TARBALL" | grep -E '^package/(bin|README)' | sed 's/^/  /'

      - name: Publish
        if: ${{ inputs.dry-run != 'true' }}
        # --access public 必须显式给：scoped 包默认按私有发布，
        # 而私有包要付费，会以 402/403 失败。package.json 的
        # publishConfig.access 已经配了同一件事，这里再写一遍是双保险 ——
        # 这一项漏掉的表现是"看起来发出去了、其实是付费墙"。
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 汇总
        if: ${{ inputs.dry-run != 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="$(node -p "require('./package.json').name")"
          echo "### $PKG@$VERSION 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/$PKG/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
