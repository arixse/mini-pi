name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm 版本由 package.json 的 packageManager 字段（pnpm@10.17.0）
      # 唯一指定，与本地/CI 保持一致；action-setup 同时读到两处会直接报错。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      # prepare 脚本会顺带执行 build:cli（esbuild 单文件产物）
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
