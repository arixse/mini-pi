name: 桌面安装包

# 与 publish.yml 共用 `v*` 这一个 tag：一次发版，npm 包与两个平台的安装包
# 同时出，不必维护两个 tag 命名空间（两处版本号各自漂移是迟早的事）。
#
# 不挂在 publish.yml 里而是单独一个工作流，是因为两者的时长与失败面
# 完全不同：publish 是"几十秒、可逆性为零"，安装包是"十几分钟、失败了
# 重跑即可"。捆在一起的话，一个平台的大文件下载超时会挡住整次发布，
# 而安装包本身并没有"发布到 registry"那种不可逆副作用。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 与 publish 一样不 cancel：出到一半被取消时，runner 上的缓存与已下载的
# 工具链都白费，而这里没有不可逆的外部副作用，排队跑完反而更快。
concurrency:
  group: desktop
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVENT_NAME: ${{ github.event_name }}
  TAG_NAME: ${{ github.ref_name }}

jobs:
  # 门禁。宁可多花几分钟，也不让"tag 打在门禁红的提交上"出一个坏安装包。
  #
  # 两个工作流各跑一遍，而不是让打包去等 publish 的结果：needs 只在同一个
  # run 内有效，跨工作流依赖做不出来。而 tag 打在坏提交上时，publish.yml
  # 会拦下 npm 包、这边却照样出包——同一个 tag 下"npm 包没发、安装包发了"，
  # 用户装到的是两个不同来源的 1.2.3。
  #
  # 刻意与 publish.yml 用**同一条命令、同一套 install**（全量而不是只装
  # 客户端包）：门禁标准一旦分岔，必然出现"一边红一边绿"，那比没有门禁更
  # 糟——它把"该信哪个"变成了一个需要人来判的问题。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 全量：pnpm check 跑的是整个 workspace 的测试与覆盖率，
      # 只装 @minipi/client... 会拿到一个跑不起来的根命令。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  installer:
    needs: gate
    # fail-fast: false：Windows 那台挂了不该连累 macOS 那台，
    # 反正两边产物互不相干，先看住能出包的那一边更有价值。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: win
            script: dist:win
          - os: macos-latest
            slug: mac
            script: dist:mac
    runs-on: ${{ matrix.os }}
    # 两个 runner 都要现场下载 Electron（约 100MB）与平台工具链；
    # 冷缓存下 10 分钟会不够，但也就几分钟的事，给 30 分钟兜底。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm 版本由 package.json 的 packageManager 字段指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 全量安装，与 gate / ci.yml / publish.yml 同一条命令。
      #
      # 曾经这里是 `pnpm install --frozen-lockfile --filter "@minipi/client..."`
      # （只装客户端包与内核），想省下 CLI 的依赖。但根 package.json 的
      # prepare 会在每次 install 时触发 build:cli，而 filter 装法下
      # packages/cli 的 node_modules 是空的——两个平台同时死在
      # `esbuild: command not found` 上（2026-10-25 手动 dispatch 复现）。
      # 且 electron 是 client 的 devDependency，filter 一样要下它，省的只有
      # CLI 的几个小 devDependency，却换来一条与 gate 分岔的安装路径——
      # 而"门禁标准分岔"正是这个文件开头要避免的东西。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 版本号以 tag 为唯一事实来源，理由与 publish.yml 里那条一致：
      # tag 打的是 v1.2.3 而包里还是 1.0.0 时，用户装到的东西与他以为的
      # 不是同一个。这里写在**客户端包**上——electron-builder 读的就是
      # 它，安装包文件名里的版本号从这里来。
      #
      # 用 npm pkg set 而不是 npm version：后者会碰 git 且要求工作区干净。
      - name: 定版本
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不是合法 semver：'$VERSION'（tag 应为 v1.2.3）"
            exit 1
          fi
          (cd packages/client && npm pkg set version="$VERSION")
          echo "安装包版本：$VERSION"

      # 客户端包自己的 dist:win / dist:mac 里已经含 build:web 与
      # build:electron 两步，这里不再重复——漏一步的表现是"包能装、
      # 打开是旧界面"，而那在 CI 里看不出来。
      - name: Build
        run: pnpm --filter @minipi/client run ${{ matrix.script }}

      # 只上传真正的分发物，不上传 win-unpacked 那 300MB 的中间目录。
      #
      # 名字里带 slug 而不是"两个 job 都叫 installer"：矩阵的两个 job
      # 会在同一次运行里互相覆盖同名产物，表现是"只有一边下载得到"。
      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          DIR="packages/client/dist/installer"
          test -d "$DIR"
          ls -la "$DIR"
          # 必须有安装包而不只是 win-unpacked：electron-builder 卡在
          # 签名或下载工具链上时，目录里会只剩一个中间目录且退出码为 0
          COUNT=$(find "$DIR" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$DIR 里没有任何安装包"
            exit 1
          fi
          echo "出包 $COUNT 个"

      - uses: actions/upload-artifact@v4
        with:
          name: mini-pi-desktop-${{ matrix.slug }}
          path: |
            packages/client/dist/installer/*.exe
            packages/client/dist/installer/*.dmg
            packages/client/dist/installer/*.zip
            packages/client/dist/installer/*.yml
          if-no-files-found: error
          retention-days: 30

  # 把两个平台的安装包挂到 Release 上。之前它们只进 Actions artifact
  # （30 天过期、还得去 run 页面翻），Release 页上什么都没有。
  release:
    needs: installer
    # 只有 tag 触发才有 Release 可挂：手动 dispatch 时 github.ref 是分支，
    # 拿分支名去建 Release 会得到一个指向分支的 Release——那不是我们想要的。
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只有这一步需要写权限，因此放在 job 上而不是 workflow 上：
    # 其余 job 保持 contents: read，不会因为一次误操作就拿到写权限。
    permissions:
      contents: write
    steps:
      # 不 checkout：gh 靠 GH_REPO 认仓库，这一步用不到源码
      - name: 取回两个平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: mini-pi-desktop-*
          path: dist
          # 默认会按 artifact 名各建一层子目录，那样上传的是目录而不是
          # 文件，表现是"Release 里有附件但下不下来"
          merge-multiple: true

      - name: 挂到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.dmg dist/*.zip dist/*.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有取回任何安装包"
            exit 1
          fi
          # 推 tag 与建 Release 是两件事，先后顺序不由我们决定：人可能
          # 已经在网页上把 Release 建好了（那时只补附件），也可能一路
          # 没人管（那就连 Release 一起建出来）。
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，只补附件"
          else
            # GITHUB_TOKEN 建的 Release 不会再触发工作流，正好免掉递归；
            # 代价是它不会出现在"谁发布的"里，这个可以接受。
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
          # 重跑同一次 tag 会撞上同名附件，没有 --clobber 就直接失败退出
          gh release upload "$TAG_NAME" "${FILES[@]}" --clobber

      - name: 汇总
        shell: bash
        run: |
          {
            echo "### $TAG_NAME 安装包"
            ls -1 dist | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
